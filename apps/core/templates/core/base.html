{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VaultDrop{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/vaultdrop.css' %}?v=4">
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% block body %}
      {% block content %}{% endblock %}
    {% endblock %}
    <form id="language-form" method="post" action="{% url 'set_language' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
    </form>
    <script>
      // Evita el doble envio; pageshow reactiva el boton al volver con Atras.
      document.addEventListener('submit', event => event.target.querySelector('[type=submit]')?.setAttribute('disabled', ''));
      addEventListener('pageshow', () => document.querySelectorAll('[type=submit][disabled]').forEach(button => button.removeAttribute('disabled')));
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
