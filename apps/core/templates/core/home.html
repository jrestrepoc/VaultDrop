{% extends "core/base.html" %}
{% load static %}

{% block title %}VaultDrop{% endblock %}

{% block body %}
  <div
    id="vaultdrop-app"
    data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
    data-user-id="{{ user.pk|default:'guest' }}"
    data-username="{{ user.username }}"
    data-email="{{ user.email }}"
    data-balance="{% if user.is_authenticated and user.billetera %}{{ user.billetera.saldo }}{% else %}0.00{% endif %}"
    data-account-url="{% url 'core:account' %}"
    data-deposit-url="{% url 'wallet:deposit' %}"
    data-inventory-url="{% url 'inventory:list' %}"
    data-profile-url="{% url 'users:profile' %}"
    data-cases-url="{% url 'cases:list' %}"
    data-login-url="{% url 'users:login' %}"
    data-register-url="{% url 'users:register' %}"
    data-dashboard-url="{% url 'users:dashboard' %}"
  ></div>
{% endblock %}

{% block scripts %}
  <script type="module" src="{% static 'core/js/vaultdrop.js' %}?v=4"></script>
{% endblock %}
