events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Solo cuenta los POST: abrir la pagina de login no gasta intentos.
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;

        location ~ ^/(login/|register/|api/v1/auth/(login|register)/)$ {
            limit_req zone=auth burst=20 nodelay;
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2/catalogo/ {
            set $catalog_service http://catalog:5000;
            proxy_pass $catalog_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
