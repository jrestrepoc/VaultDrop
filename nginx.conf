events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Solo cuenta los POST: abrir la pagina de login no gasta intentos.
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;

        error_page 429 = @demasiados_intentos;

        location @demasiados_intentos {
            default_type text/html;
            charset utf-8;
            add_header Retry-After 60 always;
            return 429 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VaultDrop</title></head><body style="background:#090b0d;color:#e2e8f0;font-family:sans-serif;padding:4rem 1rem;text-align:center"><h1>Demasiados intentos</h1><p>Espera un minuto e int&eacute;ntalo de nuevo.</p><h1 lang="en">Too many attempts</h1><p lang="en">Wait a minute and try again.</p></body></html>';
        }

        location ~ ^/(login/|register/|admin/login/|api/v1/auth/(login|register)/)$ {
            limit_req zone=auth burst=20 nodelay;
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2/catalogo/ {
            set $catalog_service http://catalog:5000;
            proxy_pass $catalog_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $django_app http://web:8000;
            proxy_pass $django_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
